<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discount Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f5f5f5;
    }
    .container {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      width: 100%;
      margin-top: 1rem;
    }
    .result {
      margin-top: 1.5rem;
      font-weight: bold;
      color: green;
    }
    .copy-button {
      margin-top: 10px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Discount Calculator</h2>
    <label for="finalAmount">Final Amount (with tax):</label>
    <input type="number" id="finalAmount" placeholder="Enter final amount" step="0.01">

    <label for="taxRate">Tax Rate (%):</label>
    <input type="number" id="taxRate" placeholder="Enter tax rate" step="0.01">

    <label for="targetAmount">Target Amount (after discount + tax):</label>
    <input type="number" id="targetAmount" placeholder="Enter target amount" step="0.01">

    <button onclick="calculateDiscount()">Calculate Discount</button>

    <div class="result" id="result"></div>
    <button id="copyButton" class="copy-button" style="display: none;" onclick="copyToClipboard()">Copy to Clipboard</button>
  </div>

  <script>
    function calculateDiscount() {
      const finalAmount = parseFloat(document.getElementById('finalAmount').value);
      const taxRate = parseFloat(document.getElementById('taxRate').value);
      const targetAmount = parseFloat(document.getElementById('targetAmount').value);

      if (isNaN(finalAmount) || isNaN(taxRate) || isNaN(targetAmount)) {
        document.getElementById('result').textContent = "❌ Please enter valid numbers.";
        return;
      }

      // Reverse-calculate base price before tax
      const basePrice = finalAmount / (1 + taxRate / 100);

      // Reverse-calculate the base target amount before tax
      const targetBase = targetAmount / (1 + taxRate / 100);

      const discountAmount = basePrice - targetBase;

      document.getElementById('result').textContent =
        `✅ You should give a discount of ₹${discountAmount.toFixed(2)} before tax.`;

      // Display the "Copy to Clipboard" button
      document.getElementById('copyButton').style.display = 'inline-block';

      // Store the discount amount in a data attribute for easy access
      document.getElementById('copyButton').setAttribute('data-amount', discountAmount.toFixed(2));
    }

    function copyToClipboard() {
      const discountAmount = document.getElementById('copyButton').getAttribute('data-amount');
      navigator.clipboard.writeText(discountAmount).then(() => {
        alert(`Copied ₹${discountAmount} to clipboard!`);
      });
    }
  </script>
</body>
</html>
